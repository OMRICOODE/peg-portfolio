<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>תיק PEG</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>תיק PEG</h1>
      <p>20 מניות · מס 25% · ענן</p>
    </header>

    <div id="loading" class="loading">טוען מהענן...</div>
    <div id="error" class="error" hidden></div>

    <main id="main" hidden>
      <section class="hero">
        <div class="value" id="totalValue">—</div>
        <div class="sub">
          <span class="chip" id="returnChip">—</span>
          <span class="chip" id="taxChip">מס: —</span>
          <span class="chip" id="dateChip">—</span>
        </div>
      </section>

      <nav class="tabs">
        <button class="tab active" data-tab="holdings">החזקות</button>
        <button class="tab" data-tab="top20">Top 20</button>
        <button class="tab" data-tab="updates">עדכונים</button>
        <button class="tab" data-tab="chart">גרף</button>
      </nav>

      <div id="holdings" class="panel active"></div>
      <div id="top20" class="panel"></div>
      <div id="updates" class="panel"></div>
      <div id="chart" class="panel">
        <div class="section-title">תיק vs SPY ($100k)</div>
        <div class="range-bar" id="rangeBar"></div>
        <div class="chart-legend">
          <span class="leg port"><i></i> תיק PEG</span>
          <span class="leg spy"><i></i> SPY</span>
        </div>
        <div class="chart-stats" id="chartStats"></div>
        <div class="chart-wrap"><canvas id="equityChart"></canvas></div>
      </div>
    </main>

    <footer>
      API בענן · קניות/מכירות אוטומטיות · עובד עם אינטרנט
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
